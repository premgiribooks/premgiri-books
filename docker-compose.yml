services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # restart: unless-stopped
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/premgiri_books?schema=public
      APP_NAME: "Premgiri Books ERP"
      APP_VERSION: "1.0.0"
      NODE_ENV: development
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - premgiri_node_modules:/app/node_modules
      - premgiri_next_cache:/app/.next

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: premgiri_books
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - premgiri_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  premgiri_postgres_data:
  premgiri_node_modules:
  premgiri_next_cache:
