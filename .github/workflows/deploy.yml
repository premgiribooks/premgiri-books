name: Build and Deploy

# Deploys the Next.js standalone server to the Termux webserver on every
# push to main. This is separate from release.yml (which packages the
# Electron desktop app) — this workflow only ships the web-server build.
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    # Runs on the self-hosted runner registered on CHE-RL-LTP14 rather than
    # a GitHub-hosted runner — this machine can reach the Termux host on
    # the local network, which a GitHub-hosted cloud runner cannot. Matched
    # by the automatic "self-hosted"/"Windows" labels rather than the
    # runner's name (only labels are used for runs-on matching); narrow
    # this to a custom label instead if a second self-hosted runner is ever
    # registered for this repo.
    runs-on: [self-hosted, Windows]
    # `run:` steps use PowerShell (pwsh isn't installed here — only
    # Windows PowerShell 5.1 — so the default resolves to `powershell`).
    # Deployment to Termux uses native OpenSSH (ssh.exe/scp.exe, both
    # present under Git for Windows) with key-based auth rather than the
    # appleboy/ssh-action / appleboy/scp-action used previously: those are
    # composite actions that shell out to a Go binary which detects the OS
    # via `uname`, and Git Bash's `MINGW64_NT-10.0-26200` string isn't one
    # they recognize ("Unknown, unsupported platform... Bailing out.") —
    # a hard incompatibility with this runner that can't be fixed from
    # this workflow file.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Build Next.js standalone server
        # Runs next build + prepare-standalone.mjs directly (skips
        # scripts/build-electron.mjs from `pnpm build`, which bundles the
        # unrelated Electron desktop entrypoints). prepare-standalone.mjs
        # already copies public/ and .next/static into .next/standalone
        # and dereferences pnpm's symlinks, so the standalone folder is
        # fully self-contained afterwards.
        run: |
          pnpm exec next build
          node scripts/prepare-standalone.mjs
        env:
          # Only needed to satisfy Prisma Client construction at import
          # time during the build, not a live connection (see build.yml).
          # The real DATABASE_URL is written to the server's .env below
          # and used at runtime.
          DATABASE_URL: "postgresql://user:password@localhost:5432/premgiri_books?schema=public"

      - name: Prepare deployment folder
        run: |
          New-Item -ItemType Directory -Force -Path deploy | Out-Null
          Copy-Item -Path ".next\standalone\*" -Destination "deploy" -Recurse -Force

      - name: Prepare SSH key and pinned known_hosts for Termux
        # Writes the deploy private key to a temp file (OpenSSH on Windows
        # refuses a key file readable by more than the current user, so
        # icacls locks it down the same way `chmod 600` would on Linux),
        # and pins the Termux host's real host key fetched directly via
        # `ssh-keyscan -p 8022 192.168.1.39` — avoids both an interactive
        # "unknown host key" prompt and blind trust-on-first-use.
        #
        # TERMUX_SSH_KEY holds the private key base64-encoded, not raw:
        # writing the multi-line PEM text straight from an env var
        # produced "Load key ... invalid format" on this runner (openssh
        # rejected it), most likely from newline handling somewhere in
        # how the runner marshals a multi-line secret into the Windows
        # process environment block. Base64 travels as a single line, so
        # there's nothing left for that to corrupt.
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "termux_deploy_key"
          [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:TERMUX_SSH_KEY_B64))
          icacls $keyPath /inheritance:r | Out-Null
          icacls $keyPath /grant:r "$($env:USERNAME):(R)" | Out-Null

          $knownHostsPath = Join-Path $env:RUNNER_TEMP "termux_known_hosts"
          Set-Content -Path $knownHostsPath -Value "[$($env:TERMUX_HOST)]:8022 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMEuHf6ttJM/HlHQmawcYdDG3Ho4y2clA3PyOShM1Nc4"
        env:
          TERMUX_SSH_KEY_B64: ${{ secrets.TERMUX_SSH_KEY }}
          TERMUX_HOST: ${{ secrets.TERMUX_HOST }}

      - name: Ensure remote app directory exists
        # scp itself won't create a missing target directory, and this
        # keeps folder setup out of your hands entirely — nothing to
        # create by hand on the phone before the first deploy.
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "termux_deploy_key"
          $knownHostsPath = Join-Path $env:RUNNER_TEMP "termux_known_hosts"
          & ssh -i $keyPath -o UserKnownHostsFile=$knownHostsPath -o StrictHostKeyChecking=yes -o BatchMode=yes -p 8022 "$($env:TERMUX_USER)@$($env:TERMUX_HOST)" "mkdir -p ~/next-app"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          TERMUX_USER: ${{ secrets.TERMUX_USER }}
          TERMUX_HOST: ${{ secrets.TERMUX_HOST }}

      - name: Upload build to webserver
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "termux_deploy_key"
          $knownHostsPath = Join-Path $env:RUNNER_TEMP "termux_known_hosts"
          # Uploading each top-level entry of deploy/ individually (rather
          # than the deploy folder itself) lands them directly inside
          # ~/next-app, matching the old appleboy/scp-action's
          # strip_components:1 behavior.
          $items = Get-ChildItem -Path "deploy" -Force | ForEach-Object { $_.FullName }
          & scp -i $keyPath -o UserKnownHostsFile=$knownHostsPath -o StrictHostKeyChecking=yes -o BatchMode=yes -P 8022 -r @items "$($env:TERMUX_USER)@$($env:TERMUX_HOST):~/next-app/"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          TERMUX_USER: ${{ secrets.TERMUX_USER }}
          TERMUX_HOST: ${{ secrets.TERMUX_HOST }}

      - name: Write runtime .env, rebuild native deps, and restart app
        # Built from an array of lines rather than a PowerShell here-string
        # (@"..."@) — a here-string's closing delimiter must sit at column
        # 0 with zero indentation, which YAML's indented block-scalar
        # syntax can't produce without breaking the YAML itself.
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "termux_deploy_key"
          $knownHostsPath = Join-Path $env:RUNNER_TEMP "termux_known_hosts"
          $remoteScriptPath = Join-Path $env:RUNNER_TEMP "termux_deploy_script.sh"

          $lines = @(
            "cat > ~/next-app/.env <<'ENVEOF'",
            "PORT=8903",
            "DATABASE_URL=$($env:DEPLOY_DATABASE_URL)",
            "SEED_ADMIN_PASSWORD=$($env:DEPLOY_SEED_ADMIN_PASSWORD)",
            "SEED_SUPER_ADMIN_PASSWORD=$($env:DEPLOY_SEED_SUPER_ADMIN_PASSWORD)",
            "ENVEOF",
            "cd ~/next-app",
            # argon2 is a native addon; the copy above carries whatever
            # binary the build machine (Windows/x64) produced, which won't
            # load on Termux's Android/aarch64 userland. Rebuilding it here
            # compiles a binary for the phone's own architecture using
            # Termux's toolchain (clang/make/python must be installed).
            "npm rebuild argon2 --build-from-source",
            "pm2 restart premgiri-books || pm2 start server.js --name premgiri-books"
          )
          Set-Content -Path $remoteScriptPath -Value ($lines -join "`n") -NoNewline

          Get-Content $remoteScriptPath -Raw | & ssh -i $keyPath -o UserKnownHostsFile=$knownHostsPath -o StrictHostKeyChecking=yes -o BatchMode=yes -p 8022 "$($env:TERMUX_USER)@$($env:TERMUX_HOST)" "bash -s"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          TERMUX_USER: ${{ secrets.TERMUX_USER }}
          TERMUX_HOST: ${{ secrets.TERMUX_HOST }}
          DEPLOY_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEPLOY_SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          DEPLOY_SEED_SUPER_ADMIN_PASSWORD: ${{ secrets.SEED_SUPER_ADMIN_PASSWORD }}
