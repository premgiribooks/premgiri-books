name: Build

# Continuous validation on every push/PR: typecheck, lint, test, and confirm
# the app (including the Electron main process and the standalone server
# output) actually builds. Does not package or publish anything — that's
# release.yml's job, triggered separately by a version tag.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec prisma generate

      # pnpm install's puppeteer postinstall (78-pdf-generation.md) downloads
      # Chromium itself, but the bare ubuntu-latest runner is missing several
      # shared libraries that binary needs to even start — confirmed directly
      # (not guessed) via a local Debian-container repro of a real CI failure:
      # `error while loading shared libraries: libnspr4.so: cannot open
      # shared object file`. Without this, every pdf-generation.test.ts test
      # fails with "Failed to launch the browser process: Code: 127" — the
      # unpacked Chromium exists on disk but its dynamic linker can't resolve
      # it. This is the standard dependency list Puppeteer's own
      # troubleshooting docs recommend for Debian/Ubuntu.
      #
      # `libasound2t64`, not `libasound2`: ubuntu-latest moved to 24.04, whose
      # 64-bit time_t (t64) transition renamed this package and dropped the
      # old name's transitional stub entirely — confirmed via a real CI
      # failure, `E: Package 'libasound2' has no installation candidate`.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ca-certificates fonts-liberation libasound2t64 libatk-bridge2.0-0 libatk1.0-0 \
            libc6 libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgbm1 \
            libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 \
            libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 \
            libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 \
            libxss1 libxtst6 lsb-release wget xdg-utils

      - run: pnpm exec tsc --noEmit
      - run: pnpm exec tsc --noEmit -p tsconfig.electron.json
      - run: pnpm lint
      - run: pnpm test

      # Same DATABASE_URL caveat as release.yml: only needed to satisfy
      # Prisma Client construction at import time, not a live connection.
      - run: pnpm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
