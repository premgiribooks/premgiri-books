name: Release desktop app

# Builds and publishes an unsigned Windows installer (see
# docs/release-process.md) to GitHub Releases whenever a `v*.*.*` tag is
# pushed. macOS and Linux builds are disabled (2026-09-22, explicit request)
# — re-add `macos-latest`/`ubuntu-latest` to the matrix below to bring them
# back; each needs its own native runner (macOS's .dmg step in particular
# needs a real macOS host, no cross-compilation).
#
# The GitHub release itself is created as a draft by its own job *before*
# the OS matrix runs, and only published (undrafted) after every OS build
# succeeds. Without this, all three matrix jobs independently see "no
# release for this tag yet" and race to create one at roughly the same
# time — confirmed by an actual v1.0.1 run, where the macOS job's publish
# step failed with "Cannot cleanup: SyntaxError: Unexpected end of JSON
# input" while uploading, from exactly that race.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # electron-updater's GitHub provider reads releases.atom/latest.yml
      # unauthenticated at runtime on every installed app — if this repo is
      # private, that 404s for every user and auto-update silently stops
      # working (confirmed: this exact failure shipped once already, see
      # docs/release-process.md's "Private repo + electron-updater" note).
      # Fail the whole release before it builds anything rather than publish
      # installers nobody's app can ever auto-update from.
      - name: Verify releases repo is public
        shell: bash
        run: |
          if [ "$(gh api "repos/${{ github.repository }}" --jq .private)" = "true" ]; then
            echo "::error::${{ github.repository }} is private. electron-updater needs unauthenticated read access to GitHub Releases at runtime, or every installed app fails to detect updates (404 on releases.atom). Make the repo public before pushing a release tag, or wire an update token into the desktop app first — see docs/release-process.md." >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Retried and made idempotent: a real v1.0.2 run failed here on a
      # transient "HTTP 500" from GitHub's own API (nothing wrong with this
      # command), and a 5xx response doesn't reliably tell you whether the
      # release was actually created server-side before the error — check
      # first so a retry after a false-negative failure doesn't try (and
      # fail) to create a release that already exists.
      - name: Create draft release
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
              echo "Release ${{ github.ref_name }} already exists"
              exit 0
            fi
            if gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" --generate-notes; then
              exit 0
            fi
            echo "create-release attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec prisma generate

      # `next build` only needs DATABASE_URL to satisfy Prisma Client
      # construction at import time — it does not connect to a live
      # database during a production build of this app's routes.
      - run: pnpm run build
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/premgiri_books?schema=public"

      # Retried: a real v1.0.1 run hit a one-off crash rebuilding argon2 for
      # Electron's ABI on windows-latest (an assertion failure inside
      # undici's HTTP/1 client while node-gyp downloaded Node headers) —
      # nothing in this repo's config, a transient runner/network blip.
      - name: Build and publish
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm exec electron-builder --publish always; then
              exit 0
            fi
            echo "electron-builder attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Undraft release
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gh release edit "${{ github.ref_name }}" --draft=false; then
              exit 0
            fi
            echo "publish-release attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
